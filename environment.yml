  - affine=2.4.0
  - gdal=3.10
  - rasterio=1.4
  - geopandas=1.1
  - libpdal-core=2.8
  - python-pdal
  - laspy=2.6
  - lazrs-python
  - numpy<2
  - pandas=2.2

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "floodtwin"
version = "0.1.0"
description = "Local research flood modelling with explicit provenance"
requires-python = ">=3.11,<3.12"
dependencies = ["hydromt-sfincs==1.2.2"]

[project.scripts]
floodtwin = "floodtwin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

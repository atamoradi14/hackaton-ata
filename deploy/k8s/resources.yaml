apiVersion: v1
kind: Namespace
metadata:
  name: auckland-flowlab
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: auckland-flowlab-workspace
  namespace: auckland-flowlab
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 8Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: auckland-flowlab-caddy
  namespace: auckland-flowlab
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auckland-flowlab-app
  namespace: auckland-flowlab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: auckland-flowlab-app}
  template:
    metadata:
      labels: {app: auckland-flowlab-app}
    spec:
      nodeSelector:
        kubernetes.io/hostname: ravand-k3s-01
      securityContext:
        runAsUser: 57439
        runAsGroup: 57439
        runAsNonRoot: true
        fsGroup: 57439
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: prepare-volume
          image: docker.io/library/auckland-flowlab-app:earth-20261015-r1
          imagePullPolicy: Never
          command: [/bin/sh, -c, 'mkdir -p /state/data /state/runs /state/configs /state/reports']
          volumeMounts:
            - {name: workspace, mountPath: /state}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      containers:
        - name: app
          image: docker.io/library/auckland-flowlab-app:earth-20261015-r1
          imagePullPolicy: Never
          args: [serve, --port, '8765']
          envFrom:
            - secretRef: {name: auckland-flowlab-provider-keys}
          env:
            - {name: FLOODTWIN_BIND, value: '0.0.0.0'}
            - {name: FLOODTWIN_PUBLIC_ORIGIN, value: 'https://daryajan.com'}
            - {name: FLOODTWIN_MAX_ACTIVE_JOBS, value: '1'}
            - {name: OMP_NUM_THREADS, value: '1'}
            - {name: PYTHONDONTWRITEBYTECODE, value: '1'}
          ports:
            - {name: http, containerPort: 8765}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: '1500m', memory: 2Gi}
          startupProbe:
            httpGet: {path: /healthz, port: http, httpHeaders: [{name: Host, value: '127.0.0.1:8765'}]}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /healthz, port: http, httpHeaders: [{name: Host, value: '127.0.0.1:8765'}]}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http, httpHeaders: [{name: Host, value: '127.0.0.1:8765'}]}
            periodSeconds: 20
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: workspace, mountPath: /work/data, subPath: data}
            - {name: workspace, mountPath: /work/runs, subPath: runs}
            - {name: workspace, mountPath: /work/configs, subPath: configs}
            - {name: workspace, mountPath: /work/reports, subPath: reports}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: workspace
          persistentVolumeClaim: {claimName: auckland-flowlab-workspace}
        - name: tmp
          emptyDir: {sizeLimit: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: auckland-flowlab-app
  namespace: auckland-flowlab
spec:
  selector: {app: auckland-flowlab-app}
  ports:
    - {name: http, port: 8765, targetPort: http}
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auckland-flowlab-caddy
  namespace: auckland-flowlab
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: auckland-flowlab-caddy}
  template:
    metadata:
      labels: {app: auckland-flowlab-caddy}
    spec:
      nodeSelector:
        kubernetes.io/hostname: ravand-k3s-01
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: caddy
          image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
          envFrom:
            - secretRef: {name: auckland-flowlab-caddy-settings}
          ports:
            - {name: http, containerPort: 80}
            - {name: https, containerPort: 443}
            - {name: http3, containerPort: 443, protocol: UDP}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 256Mi}
          readinessProbe:
            tcpSocket: {port: 80}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: 80}
            periodSeconds: 20
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL], add: [NET_BIND_SERVICE]}
          volumeMounts:
            - {name: configuration, mountPath: /etc/caddy/Caddyfile, subPath: Caddyfile, readOnly: true}
            - {name: state, mountPath: /data}
            - {name: config-state, mountPath: /config}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: configuration
          configMap: {name: auckland-flowlab-caddyfile}
        - name: state
          persistentVolumeClaim: {claimName: auckland-flowlab-caddy}
        - name: config-state
          emptyDir: {}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: auckland-flowlab-caddy
  namespace: auckland-flowlab
spec:
  selector: {app: auckland-flowlab-caddy}
  ports:
    - {name: http, port: 80, targetPort: http}
    - {name: https, port: 443, targetPort: https}
    - {name: http3, port: 443, targetPort: http3, protocol: UDP}
  type: ClusterIP
